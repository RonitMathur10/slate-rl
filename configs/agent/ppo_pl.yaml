name: ppo_pl
head: plackett_luce  # control: Plackett-Luce over the K candidates
num_envs: 256
total_steps: 1000000
rollout_len: 32        # 256 x 32 = 8192 transitions per PPO update
lr: 3.0e-4
anneal_lr: true
gamma: 0.95
gae_lambda: 0.95
epochs: 4
minibatches: 8
clip: 0.2
vf_coef: 0.5
ent_coef: 0.01         # entropy of the first-position choice
max_grad_norm: 0.5
hidden: 128
init_log_std: -1.0
eval_interval: 10
