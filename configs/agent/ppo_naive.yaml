name: ppo_naive
head: proto            # Wolpertinger-style proto-actions + nearest-neighbour mapping
num_envs: 256
total_steps: 1000000
rollout_len: 32        # 256 x 32 = 8192 transitions per PPO update
lr: 3.0e-4
anneal_lr: true
gamma: 0.95
gae_lambda: 0.95
epochs: 4
minibatches: 8
clip: 0.2
vf_coef: 0.5
ent_coef: 0.0          # Gaussian entropy in 320 dims would dominate; exploration comes from log_std
max_grad_norm: 0.5
hidden: 128
init_log_std: -1.0
proto_anchor: false   # randomly initialised proto means (the version that fails)
eval_interval: 10
