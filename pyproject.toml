[project]
name = "slate-rl"
version = "0.1.0"
description = "Long-horizon slate recommendation with deep RL in a learned MovieLens user simulator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.18",
    "gymnasium>=1.0",
    "faiss-cpu>=1.8",
    "tqdm>=4.66",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "httpx2",
    {include-group = "serve"},
    {include-group = "viewer"},
]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
viewer = [
    "streamlit>=1.40",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slate_rl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The local wandb/ run directory would otherwise make ruff treat wandb as first-party.
known-third-party = ["wandb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
